name: CI - TransOrense Pipeline

# Se ejecuta en cada Push y Pull Request hacia las ramas principales: main y dev
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  # Job 1: Verificación y Compilación del Frontend (Angular)
  frontend-build:
    name: Compilación Frontend (Angular)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del Frontend
        run: |
          cd frontend
          npm ci --legacy-peer-deps

      - name: Compilar Frontend en modo Producción
        run: |
          cd frontend
          npm run build --if-present

  # Job 2: Verificación de dependencias y sintaxis del Backend (Node.js Express)
  backend-check:
    name: Verificación Backend (Node.js)
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del Backend
        run: |
          cd backend
          npm install

      - name: Ejecutar pruebas unitarias automatizadas del Backend
        run: |
          cd backend
          npm test
